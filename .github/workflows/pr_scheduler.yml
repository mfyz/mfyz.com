name: PR Merge Schedule

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  schedule:
    # Check twice an hour, away from the busy start of the hour.
    - cron: '5,35 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List schedules without merging'
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-merge-schedule
  cancel-in-progress: false

jobs:
  merge_schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate schedules and merge due PRs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          EASTERN = ZoneInfo("America/New_York")

          def scheduled_at(body):
              lines = re.findall(r"^/schedule\b[^\n]*", body or "", re.MULTILINE)
              if not lines:
                  return None
              if len(lines) != 1 or not re.fullmatch(
                  r"/schedule \d{4}-\d{2}-\d{2} \d{2}:\d{2}\r?", lines[0]
              ):
                  raise ValueError("Use exactly one /schedule YYYY-MM-DD HH:MM line (America/New_York)")
              local = datetime.strptime(lines[0].strip()[10:], "%Y-%m-%d %H:%M").replace(tzinfo=EASTERN)
              utc = local.astimezone(timezone.utc)
              if utc.astimezone(EASTERN).replace(tzinfo=None) != local.replace(tzinfo=None):
                  raise ValueError("Scheduled time does not exist during the DST transition")
              if local.utcoffset() != local.replace(fold=1).utcoffset():
                  raise ValueError("Scheduled time is ambiguous during the DST transition")
              return utc

          def main():
              repo = os.environ["GITHUB_REPOSITORY"]
              event_name = os.environ["GITHUB_EVENT_NAME"]
              event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
              dry_run = event_name == "pull_request" or str(
                  event.get("inputs", {}).get("dry_run", "true")
              ).lower() != "false"
              if event_name == "schedule":
                  dry_run = False
              if not dry_run and os.environ["GITHUB_REF"] != "refs/heads/main":
                  raise ValueError("Merges must run from main")

              def api(path, data=None):
                  request = urllib.request.Request(
                      f"https://api.github.com/repos/{repo}/{path}",
                      data=json.dumps(data).encode() if data is not None else None,
                      method="PUT" if data is not None else "GET",
                      headers={
                          "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                          "Accept": "application/vnd.github+json",
                          "X-GitHub-Api-Version": "2022-11-28",
                      },
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)

              if event_name == "pull_request":
                  pulls = [api(f"pulls/{event['number']}")]
              else:
                  pulls = []
                  page = 1
                  while True:
                      batch = api(f"pulls?state=open&base=main&per_page=100&page={page}")
                      pulls.extend(batch)
                      if len(batch) < 100:
                          break
                      page += 1

              now = datetime.now(timezone.utc)
              report = [f"Now: {now.isoformat()} / {now.astimezone(EASTERN).isoformat()}",
                        f"Mode: {'dry run' if dry_run else 'merge due PRs'}"]
              errors = []
              for pull in pulls:
                  number = pull["number"]
                  if pull["state"] != "open" or pull["draft"] or pull["base"]["ref"] != "main":
                      continue
                  if (pull["head"].get("repo") or {}).get("full_name") != repo:
                      continue
                  try:
                      due = scheduled_at(pull.get("body"))
                      if due is None:
                          continue
                      state = "DUE" if due <= now else "future"
                      report.append(f"PR #{number}: {due.astimezone(EASTERN).isoformat()} = {due.isoformat()} ({state})")
                      if due > now or dry_run:
                          continue
                      # Re-read before merging: the body or head may have changed since listing.
                      fresh = api(f"pulls/{number}")
                      if fresh["state"] != "open" or fresh["draft"]:
                          continue
                      if fresh["base"]["ref"] != "main" or (fresh["head"].get("repo") or {}).get("full_name") != repo:
                          continue
                      if scheduled_at(fresh.get("body")) != due or fresh["head"]["sha"] != pull["head"]["sha"]:
                          raise ValueError("PR changed during this run; retry on the next run")
                      result = api(f"pulls/{number}/merge", {
                          "merge_method": "merge", "sha": fresh["head"]["sha"]
                      })
                      if not result.get("merged"):
                          raise ValueError(result.get("message", "Merge was not accepted"))
                      report.append(f"Merged PR #{number}: {result['sha']}")
                  except Exception as error:
                      errors.append(f"PR #{number}: {error}")
              report.extend(errors)
              text = "\n\n".join(report)
              print(text)
              Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(text + "\n")
              if errors:
                  raise SystemExit(1)

          if __name__ == "__main__":
              main()
          PY
